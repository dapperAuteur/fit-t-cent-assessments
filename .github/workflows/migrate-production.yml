# Migrate the production database after a merge to main, so nobody pastes a connection string
# (WitUS post-deploy automation rule; reference: invest-witus .github/workflows/migrate-production.yml).
#
# Runs when a push to main changes a file under drizzle/ (the generated migrations), and on demand
# (Actions -> "Migrate production database" -> Run workflow). It reads one repository secret,
# NEON_DIRECT_URL: the Neon direct (unpooled) connection string for this app's production branch.
# Set it once without copying the value (docs/01-operations.md, "Post-deploy steps"):
#   neon connection-string <branch> --project-id <id> | gh secret set NEON_DIRECT_URL --repo dapperAuteur/fit-t-cent-assessments
# GitHub masks the value in every log line, and scripts/migrate.ts prints only the variable name.
# The job fails closed when the secret is missing.
#
# Timing: Vercel deploys the same push in parallel. Keep migrations additive, so the old code keeps
# working on the new schema while this job runs (about a minute).
name: Migrate production database

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require NEON_DIRECT_URL
        env:
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          if [ -z "$NEON_DIRECT_URL" ]; then
            echo "::error::Set the repository secret NEON_DIRECT_URL (see docs/01-operations.md, Post-deploy steps: Database migrations)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/migrate.ts applies drizzle/ and appends the applied list to the step summary.
      - name: Migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DIRECT_URL }}
        run: pnpm db:migrate
